# ERP — public frontend/api; redis stays private (no fybud.expose).
name: erp

services:
  backend:
    image: fybud/erp-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4000"
    labels:
      fybud.expose: "true"
      fybud.domain: api.erp.fybud.com
      fybud.health: "/health"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fybud-net, internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  frontend:
    image: fybud/erp-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"
    labels:
      fybud.expose: "true"
      fybud.domain: erp.fybud.com
      fybud.health: "/"
    depends_on: [backend]
    networks: [internal]

volumes:
  uploads:

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
