# ERP — demo. Shared Postgres: fybud-postgres on fybud-net. Redis on private tenant net only.

name: erp-demo

services:
  backend:
    image: fybud/erp-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4300}:4000"
    networks: [fybud-net, tenant]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [tenant]

  frontend:
    image: fybud/erp-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-9300}:80"
    depends_on: [backend]
    networks: [tenant]

volumes:
  uploads:

networks:
  fybud-net:
    name: fybud-net
    external: true
  tenant:
    name: erp-demo-net
    driver: bridge
