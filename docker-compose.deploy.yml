# ERP — public frontend/api; redis stays private (no fybud.expose).
name: erp

services:
  backend:
    image: fybud/erp-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4000
      NODE_ENV: production
      # Empty = paste in Deploy UI. Literal = fixed here. ${VAR:?…} = Deploy-injected.
      ADMIN_PASSWORD:
      ENCRYPTION_KEY:
      SIMULATION_MODE:
      MOCK_CHANNELS:
      SYNC_CRON:
      LOG_LEVEL:
      REDIS_URL: redis://redis:6379
      # Deploy-injected — never pasted.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL required}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4000"
    labels:
      fybud.expose: "true"
      fybud.domain: api.erp.fybud.com
      fybud.role: api
      fybud.health: "/health"
    healthcheck:
      # node:alpine — use Node fetch (no curl package required).
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fybud-net, internal]
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  frontend:
    image: fybud/erp-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"
    labels:
      fybud.expose: "true"
      fybud.domain: erp.fybud.com
      fybud.role: web
      fybud.health: "/"
    depends_on: [backend]
    networks: [internal]

volumes:
  uploads:

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
