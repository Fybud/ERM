# ERP — public frontend/api; redis private.
# Only Deploy-injected: IMAGE_TAG + *_HOST_PORT. Everything else = paste (.env.deploy).
name: erp

services:
  backend:
    image: fybud/erp-api:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: "4000"
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SYNC_CRON: "*/5 * * * *"
      LOG_LEVEL: info
      MOCK_CHANNELS: "false"
      ADMIN_PASSWORD:
      ENCRYPTION_KEY:
      SIMULATION_MODE:
      DATABASE_URL:
      CORS_ORIGIN:
      PUBLIC_API_URL:
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4000"
    labels:
      fybud.expose: "true"
      fybud.domain: api.erp.fybud.com
      fybud.role: api
      fybud.health: "/health"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fybud-net, internal]
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  frontend:
    image: fybud/erp-web:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"
    labels:
      fybud.expose: "true"
      fybud.domain: erp.fybud.com
      fybud.role: web
      fybud.health: "any"
    depends_on: [backend]
    networks: [internal]

volumes:
  uploads:

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
