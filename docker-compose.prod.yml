# Production overlay: env + bind app ports for host nginx (80/443 stay on the VM).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   sudo ./scripts/enable-nginx.sh

services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  backend:
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-https://erm-demo.fybud.com,https://api.erm-demo.fybud.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.erm-demo.fybud.com}
      MOCK_CHANNELS: ${MOCK_CHANNELS:-false}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.erm-demo.fybud.com}
    ports:
      - "127.0.0.1:3000:80"
